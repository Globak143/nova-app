apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nova-app-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["nova-app-deployment"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-app-deployer-binding
  namespace: default
subjects:
  - kind: Group
    name: nova-app-ci-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: nova-app-deployer
  apiGroup: rbac.authorization.k8s.io